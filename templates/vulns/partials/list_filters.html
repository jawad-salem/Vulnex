<div class="filter-bar finding-filters" data-advanced-open="{% if sla_filter or assigned_filter or review_filter %}1{% else %}0{% endif %}">
    <form method="get" class="finding-filters__form">
        <div class="finding-filters__row finding-filters__row--primary">
            <input type="text" name="q" aria-label="Search findings" value="{{ request.GET.q|default:'' }}" placeholder="Search findings..." class="form-input search-input finding-filters__search">
            <select name="severity" aria-label="Severity" class="form-input" data-autosubmit-loading>
                <option value="">All severities</option>
                {% for val, label in severity_choices %}
                <option value="{{ val }}" {% if request.GET.severity == val %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <select name="status" aria-label="Status" class="form-input" data-autosubmit-loading>
                <option value="">All statuses</option>
                {% for val, label in status_choices %}
                <option value="{{ val }}" {% if request.GET.status == val %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <select name="retest" class="form-input" data-autosubmit-loading aria-label="Retest outcome">
                <option value="">All retest outcomes</option>
                {% for val, label in retest_choices %}
                <option value="{{ val }}" {% if retest_filter == val %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
            <button type="button" class="btn finding-filters__toggle" data-filter-toggle aria-expanded="{% if sla_filter or assigned_filter or review_filter %}true{% else %}false{% endif %}">
                <span class="finding-filters__toggle-label">More filters</span>
                {% if sla_filter or assigned_filter or review_filter %}
                <span class="finding-filters__toggle-dot" aria-hidden="true"></span>
                {% endif %}
                <svg class="finding-filters__chevron" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 6 8 10 12 6"/></svg>
            </button>
            <button type="submit" class="btn btn-primary">Filter</button>
        </div>
        <div class="finding-filters__row finding-filters__row--advanced" data-filter-panel>
            <label class="finding-filters__field">
                <span class="finding-filters__field-label">SLA</span>
                <select name="sla" class="form-input" data-autosubmit-loading>
                    <option value="">All SLA</option>
                    <option value="overdue" {% if sla_filter == 'overdue' %}selected{% endif %}>Overdue</option>
                    <option value="due_soon" {% if sla_filter == 'due_soon' %}selected{% endif %}>Due soon (≤3d)</option>
                    <option value="on_track" {% if sla_filter == 'on_track' %}selected{% endif %}>On track</option>
                </select>
            </label>
            <label class="finding-filters__field">
                <span class="finding-filters__field-label">Assignee</span>
                <select name="assigned" class="form-input" data-autosubmit-loading>
                    <option value="">All assignees</option>
                    <option value="me" {% if assigned_filter == 'me' %}selected{% endif %}>Assigned to me</option>
                    <option value="unassigned" {% if assigned_filter == 'unassigned' %}selected{% endif %}>Unassigned</option>
                    {% for m in assignable_members %}
                    <option value="{{ m.user.pk }}" {% if assigned_filter == m.user.pk|stringformat:"s" %}selected{% endif %}>{{ m.user }}</option>
                    {% endfor %}
                </select>
            </label>
            {% if not is_client %}
            <label class="finding-filters__field">
                <span class="finding-filters__field-label">Review</span>
                <select name="review" class="form-input" data-autosubmit-loading>
                    <option value="">All review states</option>
                    {% for val, label in review_choices %}
                    <option value="{{ val }}" {% if review_filter == val %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
            {% endif %}
        </div>
    </form>
</div>
