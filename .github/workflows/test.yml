name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt -c requirements.lock
      - run: python manage.py check --settings=vulnex.test_settings
      - run: python manage.py makemigrations --check --dry-run --settings=vulnex.test_settings
      - run: python manage.py test --noinput --settings=vulnex.test_settings
